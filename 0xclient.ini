; 0xclient.ini -- sits next to 0xclient.dll. Edit this, not the code.
;
; There is only one setting, and the build fills it in for you. Everything a PLUGIN can be configured
; with lives in the control panel instead, where you can change it while the client is running.

[0xclient]
; Where your JDK lives.
;
; It needs bin\server\jvm.dll under it -- a JDK always has that, some JREs do not. `gradlew dist` writes
; this line pointed at whichever JDK built the client, so you should not have to touch it. If you move
; your JDK, delete this file and build again.
java=C:\Program Files\Java\jdk-21
